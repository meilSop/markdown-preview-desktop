# Trellis 配置
# Trellis 工作流系统的项目级设置
#
# 所有值都有合理的默认值。仅覆盖需要修改的配置项。

#-------------------------------------------------------------------------------
# 会话记录
#-------------------------------------------------------------------------------

# 运行 add_session.py 后自动提交 journal/index 变更时使用的提交信息
session_commit_message: "chore: record journal"

# 单个 journal 文件的最大行数，超过后自动轮转到新文件
max_journal_lines: 2000

#-------------------------------------------------------------------------------
# 会话自动提交
#-------------------------------------------------------------------------------

# 会话 journal + 任务归档操作的自动提交行为。
# - true（默认值）：add_session.py / task.py archive 运行后，脚本自动暂存并提交 journal / 任务变更。
# - false：脚本不操作 git。文件（journal-*.md、任务归档移动）仍会写入磁盘；
#   由你决定是否手动 git add / commit。
#
# 如果项目的 .gitignore 有意排除了 `.trellis/`，且希望会话数据仅保留在本地，
# 或者希望在每次提交前手动审查暂存变更，请使用 `false`。
#
# 接受值：true / false / yes / no / 1 / 0 / on / off（不区分大小写）。
#
# session_auto_commit: true

#-------------------------------------------------------------------------------
# 任务生命周期钩子
#-------------------------------------------------------------------------------

# 任务生命周期事件后运行的 Shell 命令。
# 每个钩子接收 TASK_JSON_PATH 环境变量，指向 task.json。
# 钩子失败会打印警告，但不会阻塞主操作。
#
# hooks:
#   after_create:
#     - "echo '任务已创建'"
#   after_start:
#     - "echo '任务已启动'"
#   after_finish:
#     - "echo '任务已完成'"
#   after_archive:
#     - "echo '任务已归档'"

#-------------------------------------------------------------------------------
# Monorepo / 包
#-------------------------------------------------------------------------------

# 为 monorepo 项目声明包。
# Trellis 在 `trellis init` 期间自动检测工作区，但也可以在此手动配置。
#
# packages:
#   frontend:
#     path: packages/frontend
#   backend:
#     path: packages/backend
#   docs:
#     path: docs-site
#     type: submodule
#   # 对于 polyrepo / meta-repo 布局（每个子目录有独立的 .git），
#   # 将包标记为 `git: true`。运行时会将其视为独立仓库。
#   webapp:
#     path: ./webapp
#     git: true

# 未指定 --package 时使用的默认包。
# default_package: frontend

#-------------------------------------------------------------------------------
# Channel worker OOM 保护
#-------------------------------------------------------------------------------
# `trellis channel spawn` worker 的默认保护措施。保护在 spawn 时运行
# （清理过期的空闲 worker，然后强制执行活跃 worker 预算）以及每个
# supervisor 内部（自终止持续空闲超过 `idle_timeout` 的 worker）。
#
# 优先级：CLI 标志 > 环境变量（TRELLIS_CHANNEL_WORKER_IDLE_TIMEOUT /
# TRELLIS_CHANNEL_MAX_LIVE_WORKERS）> 此配置 > 内置默认值。
#
# `idle_timeout: 0` 禁用空闲清理（worker 可以无限期空闲，
# 除非被显式终止或设置了 `--timeout`）。
# `max_live_workers: 0` 禁用 spawn 时的预算检查。
#
# `trusted_context_dirs` 将 `--file`/`--jsonl`/`--agent` 的容器检查
# 扩展到 worker cwd 之外 — 当 `.trellis/tasks` 或 `.trellis/workspace`
# 是指向外部目录的符号链接时很有用。列出的目录下的真实路径会被接受。
# `auto_trust_trellis_symlinks: false` 禁用对 `.trellis/tasks` /
# `.trellis/workspace` 的自动信任（默认启用自动信任）。
#
channel:
  worker_guard:
    idle_timeout: 5m
    max_live_workers: 6
  # trusted_context_dirs:
  #   - /work/user/trellis_workspace
  # auto_trust_trellis_symlinks: false

#-------------------------------------------------------------------------------
# Codex（调度行为）
#-------------------------------------------------------------------------------
# 仅 Codex 的配置项；其他平台忽略。默认值（"auto"）调度
# trellis-implement / trellis-check / trellis-research 子代理。这不依赖
# 继承的父会话记录：`fork_turns` 仍由调用方控制，而 Codex 的原生
# SubagentStart 钩子在受信任时注入任务上下文，子侧加载在不可用时作为回退。
# 仅在需要将会话实现和检查保留在主会话中时设置为 "inline"。
# "sub-agent" 是 "auto" 的向后兼容别名。无效值安全地回退到 inline 模式。
#
# 在 "auto" 模式下，调度的子代理继承主会话的模型，除非你固定了一个。
# 要为 implement/check/research 子代理使用更便宜/更快的模型，直接编辑
# 生成的 `.codex/agents/trellis-*.toml` 文件上的 `model` / `model_reasoning_effort`
# （参见这些文件中的注释提示行）— config.yaml 中没有对应的配置项，
# `trellis update` 会在重新生成时保留你的编辑。
#
# codex:
#   dispatch_mode: auto  # 或 "inline"；旧别名："sub-agent"

#-------------------------------------------------------------------------------
# 子代理上下文注入限制
#-------------------------------------------------------------------------------
# 限制多少任务上下文（implement.jsonl / check.jsonl 引用文件，加上
# prd.md / design.md / implement.md）被内联到子代理的第一个提示中。
# 超大的文件会被截断并附带通知；一旦达到总负载上限，剩余文件退化为
# 索引行（路径 + 原因 + 大小）而不是内联。
#
# 所有值为字节数。`0` 禁用相应限制。
#
# context_injection:
#   max_file_bytes: 32768        # 每个 implement.jsonl / check.jsonl 引用文件
#   max_artifact_bytes: 65536    # 每个任务制品（prd.md / design.md / implement.md）
#   max_total_bytes: 131072      # 整个注入负载；溢出退化为索引行

#-------------------------------------------------------------------------------
# 每轮提示注入
#-------------------------------------------------------------------------------
# 每轮 <workflow-state> 面包屑的逃生开关。当用户提示包含跳过关键词
# （作为独立单词，不区分大小写，词边界匹配 — "no-trellisfoo" 不算）时，
# 该轮跳过面包屑。不影响 SessionStart 或子代理上下文注入。
#
# prompt_injection:
#   skip_keyword: "no-trellis"   # "" 完全禁用逃生开关

# 自动检测的 monorepo 包
packages:
  syfb-backend:
    path: syfb-backend
    git: true
  sungrow-repo:
    path: syfb-frontend-pc
    git: true
default_package: syfb-backend
