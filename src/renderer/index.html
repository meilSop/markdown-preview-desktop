<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Markdown Preview</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws://localhost:*"
    />
    <!-- connect-src 额外放开本地 ws：CSP 'self' 不匹配 ws: scheme，不加会拦截 dev 模式 vite HMR；
         生产经 file:// 加载无 ws 使用，不构成额外暴露 -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
